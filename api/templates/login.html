{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-950 flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <!-- Основная карточка -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white">Вход в систему</h1>
                <p class="text-gray-400 mt-2">FastAPI + ClickHouse</p>
            </div>

            <!-- Сообщение о БД -->
            <div class="bg-green-950 border border-green-800 text-green-400 rounded-xl p-4 mb-8 flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                <span class="text-sm font-medium">Связь с базой данных ClickHouse установлена и работает</span>
            </div>

            <form method="post" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Логин или email</label>
                    <input 
                        type="text" 
                        name="username"
                        required
                        class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-blue-500 text-white placeholder-gray-500"
                        placeholder="Введите логин">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Пароль</label>
                    <input 
                        type="password" 
                        name="password"
                        required
                        class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-blue-500 text-white placeholder-gray-500"
                        placeholder="Введите пароль">
                </div>

                <button 
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 transition-colors text-white font-semibold py-3.5 rounded-xl text-base">
                    Войти
                </button>
            </form>

            {% if error %}
            <div class="mt-6 bg-red-950 border border-red-800 text-red-400 rounded-xl p-4 text-sm text-center">
                {{ error }}
            </div>
            {% endif %}
        </div>

        <p class="text-center text-gray-500 text-sm mt-6">
            © 2026 Ваш Проект
        </p>
    </div>
</div>
{% endblock %}
