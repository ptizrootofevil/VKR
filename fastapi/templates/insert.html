<!DOCTYPE html>
<html>
<head>
    <title>Добавить запись</title>
    <meta charset="utf-8">
    <style>
        body {font-family: Arial, sans-serif; padding: 40px; max-width: 600px; margin: auto;}
        input, button {margin: 10px 0; padding: 8px; font-size: 16px;}
        button {background: #007bff; color: white; border: none; cursor: pointer;}
        button:hover {background: #0056b3;}
    </style>
</head>
<body>
    <h2>Добавить новую запись</h2>
    <form action="/insert" method="post">
        <input type="number" name="id" placeholder="ID (число)" required><br>
        <input type="text" name="name" placeholder="Имя" required><br>
        <button type="submit">Добавить</button>
    </form>
    <hr>
    <a href="/select">Посмотреть все записи →</a>
</body>
</html>
